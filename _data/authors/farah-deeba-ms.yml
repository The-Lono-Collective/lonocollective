name: Farah Deeba, MS
url: ''
bio: Farah brings five years of AI evaluation experience across more than ten frontier platforms, with a focus on adversarial red-teaming, multimodal assessment, and quality assurance. As a Quality Production specialist and Golden Annotator at Centific, she contributed to the training and August 2024 launch of Amazon India’s Rufus AI. Her platform portfolia includes Scale AI / Outlier (Red Team, Safety, STEM, Linguistics; 2023-2025), e2f (Gen AI Trainer; 2024-2025), Fyxer AI (Advanced Quality Analyst; 2025-2026), Invisible (Expert Trainer; current), Abaka AI (Advanced Quality Analyst and Generalist AI Trainer; current), and Turing (Domain Expert – Stem; current). She continuously red-teams Grok, OpenAI models, Gemini, Claude, and Fyxer AI for safety loopholes, factual weaknesses, and behavioral inconsistencies, and holds Lakera’s Gandalf prompt-injection certification. Farah earned her M.Sc in Biotechnology from the University of Kashmir under a Department of Biotechnology (DBT) scholarship, with a published international conference abstract on TP53 isoform expression in colorectal cancer. She works in English and Hindi and serves Lono as a Research Assistant.
