name: Farah Deeba, MS
url: ''
bio: |-
  Farah brings five years of AI evaluation experience across more than ten leading AI platforms, specialising in adversarial red-teaming, multimodal AI evaluation, advanced STEM reasoning, and quality assurance. Her professional experience includes Scale AI/Outlier, Centific, Embibe AI EdTech, Abaka AI, Fyxer AI, Turing, and other AI organisations. She currently works as an Expert Trainer at Invisible Technologies and a STEM Expert at Handshake AI.

  As a Quality Production Specialist and Golden Annotator at Centific, she contributed to the training and August 2024 launch of Amazon India's Rufus AI. Previously, as an Academic Lead at Embibe AI EdTech, she contributed to the development of Embibe Lens, an AI-powered augmented reality (AR) educational application, integrating scientific content with interactive 2D and 3D models, animations, and educational videos to enhance visual and interactive learning.

  Through her independent research initiative, AI Expedition, she investigates leading models, including GPT, Claude, Gemini, Grok, and DeepSeek, focusing on jailbreaks, prompt injection, hallucinations, and safety vulnerabilities. She has also researched more than seven mental health chatbots, identifying epistemic drift, excessive emotional validation, and potentially harmful responses to vulnerable users. She holds Lakera's Gandalf prompt-injection certification.

  Farah holds an MS in Biotechnology from the University of Kashmir, supported by a Department of Biotechnology (DBT) scholarship. Her research on TP53 isoform expression in colorectal cancer, particularly elevated Δ133p53 expression, was presented at an international conference and documented in a published abstract.
