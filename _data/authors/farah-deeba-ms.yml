name: Farah Deeba, MS
url: ''
bio: Farah brings five years of AI evaluation experience across more than ten frontier platforms, with a focus on adversarial red-teaming, multimodal assessment, and quality assurance. As a Quality Production Specialist and Golden Annotator at Centific, she contributed to the training and August 2024 launch of Amazon India's Rufus AI. As an Academic Lead at Embibe AI EdTech, she contributed to Embibe Lens, an AI-powered augmented reality (AR) educational application featuring 2D/3D models, animations, and videos. Her platform portfolio includes Scale AI / Outlier (Red Team, Safety, STEM, Linguistics; 2023–2025), e2f (Gen AI Trainer; 2024–2025), Fyxer AI (Advanced Quality Analyst; 2025–2026), Abaka AI (Advanced Quality Analyst and Generalist AI Trainer; 2025–2026), Turing (Domain Expert – STEM; 2026), Invisible (Expert Trainer; current) and Handshake (STEM Expert; current). She has conducted adversarial red-teaming of Grok, OpenAI models, Gemini, Claude, DeepSeek, and Fyxer AI, investigating safety loopholes, factual weaknesses, and behavioural inconsistencies, and holds Lakera's Gandalf prompt-injection certification. Farah earned her MS in Biotechnology from the University of Kashmir under a Department of Biotechnology (DBT) scholarship. Her research on TP53 isoform expression in colorectal cancer, particularly elevated Δ133p53 expression, was presented at an international conference and documented in a published abstract. She serves Lono Collective as an Associate Member and Research Assistant, where she has already researched more than seven mental health chatbots, examining epistemic drift, excessive emotional validation, and potentially harmful responses to vulnerable users.
